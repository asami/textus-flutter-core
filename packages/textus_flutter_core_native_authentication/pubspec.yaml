name: textus_flutter_core_native_authentication
description: Internal opaque native authentication credential storage.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.13.3
  flutter: ">=3.47.4"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: org.textus.flutter.core.authentication
        pluginClass: TextusFlutterCoreNativeAuthenticationPlugin
      ios:
        pluginClass: TextusFlutterCoreNativeAuthenticationPlugin
